[package]
name = "adscrub"
version = "0.1.0"
edition = "2021"
description = "Adapter and read-through scrubbing for short-read pairs — the first stage of the genemayers pipeline"
license = "MIT"

[dependencies]
flate2 = "1"
hashbrown = "0.14"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lib]
name = "adscrub"
path = "src/lib.rs"

[[bin]]
name = "adscrub"
path = "src/bin/adscrub.rs"

[profile.release]
opt-level = 3
lto = true
